# Single nginx config for the SERVER (host) nginx, behind Cloudflare.
# Routes both apps:
#   /     -> frontend container (127.0.0.1:8081)
#   /api  -> backend container  (127.0.0.1:8088)
#
# Cloudflare setup (SSL/TLS mode must be "Full (strict)" — NOT Flexible,
# Flexible would cause an infinite redirect loop with this config):
#   1. Cloudflare dashboard -> SSL/TLS -> Origin Server -> Create Certificate
#      (defaults are fine: *.oetpractice.org + oetpractice.org, 15 years)
#   2. Save the two blobs on the server:
#        /etc/ssl/cloudflare/oetpractice.org.pem   (Origin Certificate)
#        /etc/ssl/cloudflare/oetpractice.org.key   (Private Key, chmod 600)
#   3. SSL/TLS -> Overview -> set mode to "Full (strict)"
#   4. SSL/TLS -> Edge Certificates -> enable "Always Use HTTPS"
#
# Install on the server:
#   sudo cp server-nginx.conf /etc/nginx/sites-available/oetexam
#   sudo ln -s /etc/nginx/sites-available/oetexam /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

# Redirect any plain-HTTP request to HTTPS
server {
    listen 80;
    server_name oetpractice.org www.oetpractice.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name oetpractice.org www.oetpractice.org;

    # Cloudflare Origin Certificate (trusted by Cloudflare, not by browsers —
    # fine, since browsers only ever see Cloudflare's edge certificate)
    ssl_certificate     /etc/ssl/cloudflare/oetpractice.org.pem;
    ssl_certificate_key /etc/ssl/cloudflare/oetpractice.org.key;

    # Frontend (Angular app served by the frontend container)
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (Spring Boot container)
    location /api {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        client_max_body_size 100m;   # nginx default is 1m — audio uploads need more
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}