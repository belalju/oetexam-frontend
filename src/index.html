<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OET Practice Tests for Doctors and Nurses | Reading, Listening, Writing &amp; Speaking</title>
  <meta name="description" content="Prepare for OET with computer-based Reading and Listening practice tests for doctors, nurses, and healthcare professionals. Start with a free test and access Writing and Speaking evaluation when needed.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="logo.png">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

</head>
<body>
  <app-root></app-root>


    <script>
    const btn = document.getElementById('fullscreen-btn');
    const container = document.getElementById('test-container');

    btn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => {
          alert(`Error attempting to enable full-screen mode: ${err.message}`);
        });
        btn.innerText = "Exit Fullscreen";
      } else {
        document.exitFullscreen();
        btn.innerText = "Go Fullscreen";
      }
    });
  </script>

</body>
</html>
